<style>

body{margin:0;color:var(--txt);font-family:'Chakra Petch',system-ui,sans-serif;min-height:100vh;background:
linear-gradient(#ffffff06 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#ffffff06 1px,transparent 1px) 0 0/32px 32px,

body{font-family:'Roboto',system-ui,sans-serif;background:linear-gradient(#ffffff05 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#ffffff05 1px,transparent 1px) 0 0/32px 32px,radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--line) 14%,#02030a) 0%,var(--bg) 65%) fixed var(--bg)}

#skc.cold{border-color:#6fb4ff88;color:#9ec8ff}#skc.cold .fire{filter:grayscale(1) brightness(1.4) drop-shadow(0 0 7px #6fb4ff);animation:cold 1.8s ease-in-out infinite}@keyframes cold{50%{transform:scale(1.2);opacity:.55}}

<body>
<div id="toast" role="status"></div>

<section id="auth">
  <div style="text-align:center;font-size:3rem;margin-top:24px">⚔️</div>
  <h1>[ SISTEMA ]</h1>
  <p class="sm" style="text-align:center;margin:0 0 16px">Jogador não identificado. Faça login ou registre-se.</p>
  <div class="win">
    <div class="tabs"><button id="tin" class="sel">Entrar</button><button id="tup">Cadastrar</button></div>
    <label for="lu">Usuário</label><input id="lu" autocomplete="username" autocapitalize="none" maxlength="20">
    <label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password">
    <div id="cf" hidden><label for="lp2">Confirmar senha</label><input id="lp2" type="password" autocomplete="new-password"></div>
    <div id="err" role="alert"></div>
    <button class="pri" id="go" style="width:100%">Entrar</button>
    <p class="sm" style="margin:10px 0 0">As contas ficam salvas somente neste aparelho e navegador.</p>
  </div>
</section>

<main id="app" hidden>
  <header class="win" id="hd">
    <div class="row">
      <div class="av" id="av"></div>
      <div style="flex:1;min-width:0"><div class="nm" id="nm" style="font-size:1.15rem"></div><div class="sm" id="tt"></div><div class="sm" id="bio"></div></div>
      <div class="rank" id="rank"></div>
    </div>
    <div class="bar"><i id="xpb"></i></div><div class="sm" id="xpt"></div>
    <div class="chips"><div id="skc"><b id="stk"></b><span class="fire">🔥</span> Sequência</div><div><b id="dn"></b>✔ Missões</div><div><b id="bs"></b>🏆 Recorde</div></div>
  </header>

  <div id="v-q">
    <div class="win"><h2>MISSÕES DIÁRIAS</h2><div id="ql"></div><div class="sm" id="pen"></div></div>
    <button class="pri" id="gcf" style="width:100%;margin-bottom:14px">＋ Nova missão</button>
  </div>
  <div id="v-st" hidden></div>
  <div id="v-sh" hidden></div>
  <div id="v-pf" hidden></div>
  <div id="v-rk" hidden></div>
  <div id="v-cf" hidden>
    <div class="win"><h2>NOVA MISSÃO</h2>
      <label for="qn">Nome</label><input id="qn" maxlength="40" placeholder="Ex.: Ler, Beber água">
      <div class="fb"><div><label for="qg">Meta</label><input id="qg" type="number" min="1" placeholder="20"></div><div><label for="qu">Unidade</label><input id="qu" maxlength="10" placeholder="min, reps"></div></div>
      <label for="qs2">Atributo fortalecido</label><select id="qs2"><option value="FOR">Força</option><option value="AGI">Agilidade</option><option value="VIT">Vitalidade</option><option value="INT">Inteligência</option><option value="SEN">Percepção</option></select>
      <button class="pri" id="add" style="width:100%">Adicionar missão</button></div>
    <div id="cfd"></div>
  </div>
</main>

<nav id="nav" hidden><button data-v="q" class="sel"><span>⚔️</span>Missões</button><button data-v="st"><span>📊</span>Status</button><button data-v="rk"><span>🏆</span>Ranking</button><button data-v="pf"><span>👤</span>Perfil</button><button data-v="sh" id="nsh" hidden><span>🛒</span>Loja</button><button data-v="cf"><span>⚙️</span>Config</button></nav>

<script>
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={au:{m:1,s:1,v:1}},U=null;
const RANK_URL=''; // URL do Firebase Realtime Database, ex.: https://meu-app-default-rtdb.firebaseio.com
let AC,sg,mg,gb,nb,mt,step=0,nextT=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();sg=AC.createGain();sg.gain.value=.5;sg.connect(AC.destination);
 mg=AC.createGain();mg.gain.value=.07;const cp=AC.createDynamicsCompressor();cp.threshold.value=-18;cp.ratio.value=4;mg.connect(cp);cp.connect(AC.destination);
 gb=AC.createWaveShaper();const c=new Float32Array(256);for(let i=0;i<256;i++)c[i]=Math.tanh((i/128-1)*8);gb.curve=c;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;gb.connect(lp);lp.connect(mg);lp.connect(mr());
 nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(AC.state==='suspended')AC.resume();applyVol();return AC}
function tone(f,d,ty,v,t0,f2,dst){const a=ac(),o=a.createOscillator(),e=a.createGain(),t=a.currentTime+(t0||0);o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(e);e.connect(dst||sg);o.start(t);o.stop(t+d)}
function sfx(n){if(!S.au.s)return;try{
 if(n==='click')tone(700,.06,'square',.12,0,1100);
 else if(n==='sys'){tone(1400,.08,'sine',.25,0);tone(1900,.14,'sine',.25,.09)}
 else if(n==='done'){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.3,.12+i*.09))}
 else if(n==='lvl'){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'sawtooth',.16,i*.08))}
 else if(n==='del')tone(400,.2,'sawtooth',.15,0,120)}catch(e){}}

const VP=[{n:'Sistema',p:.5,r:.9,f:98},{n:'Narrador',p:.8,r:1,f:118},{n:'Lenda',p:.3,r:.8,f:78}];
const TX={mc:'Missão concluída.',ex:'Extraordinário.',pa:'Parabéns.',ex2:'Excelente.',in:'Incrível.',cn:'Continue assim.',nv:'Nível aumentado.'};
const WD={mc:[['m','i',.12],['s','a',.15],['','u',.12],['k','o',.12],['k','u',.09],['l','u',.1],['','i',.14],['d','a',.24]],
 ex:[['','e',.1],['s','',.1],['t','a',.11],['','o',.1],['d','i',.11],['n','a',.17],['d','i',.09],['','u',.26]],
 pa:[['p','a',.11],['d','a',.1],['b','e',.13],['','i',.14],['s','',.1]],
 ex2:[['','e',.1],['s','e',.1],['l','e',.12],['t','i',.18]],
 in:[['','i',.1],['k','i',.1],['d','i',.09],['v','e',.12],['l','u',.18]],
 cn:[['k','o',.1],['t','i',.1],['n','u',.1],['','e',.1],['','a',.09],['s','i',.18]],
 nv:[['n','i',.12],['v','e',.13],['l','',.05],['','a',.09],['','u',.09],['m','e',.1],['t','a',.11],['d','u',.22]]};
const FM={a:[730,1090,2440],e:[530,1840,2480],i:[270,2290,3010],o:[570,840,2410],u:[300,870,2240]};
function nz(t,d,hp,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),e=AC.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(e);e.connect(sg);s.start(t);s.stop(t+d)}
function vow(fm,p,d,t,end,amp){const o=AC.createOscillator(),o2=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),e=AC.createGain(),lp=AC.createBiquadFilter();
 o.type=o2.type='sawtooth';o.frequency.setValueAtTime(p,t);o.frequency.linearRampToValueAtTime(p*end,t+d);o2.frequency.setValueAtTime(p*1.006,t);o2.frequency.linearRampToValueAtTime(p*1.006*end,t+d);
 lf.frequency.value=5;lg.gain.value=p*.02;lf.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
 e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(amp,t+.03);e.gain.setValueAtTime(amp,t+d*.7);e.gain.linearRampToValueAtTime(0,t+d);
 lp.type='lowpass';lp.frequency.value=3200;
 fm.forEach((f,i)=>{const b=AC.createBiquadFilter(),g=AC.createGain();b.type='bandpass';b.frequency.value=f*.92;b.Q.value=6;g.gain.value=[2,1.7,.7][i];o.connect(b);o2.connect(b);b.connect(g);g.connect(lp)});

 $('ql').innerHTML=S.q.map(q=>{const s=Math.min(5,1+Math.floor(q.n/3));return '<div class="q '+q.stat+(q.paid?' done':'')+'" data-id="'+q.id+'"><div class="row"><span class="nm"><span class="ic">'+ST[q.stat][0]+'</span> '+esc(q.name)+'</span><span class="star" title="Dificuldade">'+'★'.repeat(s)+'☆'.repeat(5-s)+'</span></div><div class="sm">'+q.p+' / '+q.goal+' '+esc(q.unit)+' · <b class="px" style="color:var(--ac)">'+ST[q.stat][1]+'</b></div><div class="bar"><i style="width:'+(q.p/q.goal*100)+'%"></i></div><div class="acts">'+(q.paid?'<span class="sm g" style="align-self:center">✔ Concluída</span>':'<button class="g" data-a="s" data-i="'+q.id+'">+'+q.step+' '+esc(q.unit)+'</button><button data-a="f" data-i="'+q.id+'">Concluir</button>')+'<button class="x" data-a="d" data-i="'+q.id+'" aria-label="Remover">✕</button></div></div>'}).join('')||'<div class="sm">Nenhuma missão. Adicione uma abaixo.</div>';
 const left=S.q.filter(q=>!q.paid).length;$('pen').textContent=left?'Missões incompletas até a meia-noite resultam em penalidade (-30 XP).':'Todas as missões concluídas hoje.';
 const mx=Math.max(50,...Object.values(S.st)),wk=Object.keys(S.hist).sort((a,b)=>S.hist[a]-S.hist[b])[0];
 $('v-st').innerHTML='<div class="win"><h2>ATRIBUTOS</h2>'+Object.keys(S.st).map(k=>'<div class="sb" style="--ac:var(--c-'+k+')"><span class="sbn">'+ST[k][0]+' '+ST[k][1]+'</span><div class="bar hp"><i style="width:'+S.st[k]/cap(S.st[k])*100+'%"></i></div><b>'+S.st[k]+'/'+cap(S.st[k])+'</b></div>').join('')+'</div><div class="win"><h2>ANÁLISE DO SISTEMA</h2><p class="sm" style="margin:0 0 8px">Missões concluídas por atributo:</p>'+Object.keys(S.hist).map(k=>'<div class="row sm"><span>'+ST[k][0]+' '+ST[k][1]+'</span><b style="color:var(--txt)">'+S.hist[k]+'</b></div>').join('')+'<p class="sm">Ponto fraco: <b style="color:var(--gold)">'+ST[wk][1]+'</b>. Novas missões priorizam esse atributo. Dificuldade das missões sobe cerca de 8% por dia concluído, até 5x a meta inicial.</p></div>'}
function pf(){const sl=c=>c?' sel':'';
 $('v-pf').innerHTML='<div class="win"><h2>PERFIL</h2><label for="pn">Nome de exibição</label><input id="pn" maxlength="20" value="'+esc(S.name)+'"><label for="pt">Título (vazio = automático)</label><input id="pt" maxlength="24" placeholder="Auto: '+classe()+'" value="'+esc(S.ttl||'')+'"><label for="pb">Meu objetivo</label><input id="pb" maxlength="60" placeholder="Ex.: correr 5 km sem parar" value="'+esc(S.bio)+'">'
 +'<label>Foto de perfil</label><div class="acts"><label class="btn g fbtn">📷 Escolher da galeria<input type="file" id="fph" accept="image/*"></label><button id="rph">Remover</button><button id="sh" aria-label="Formato da foto">'+(S.shape?'⬜':'⭕')+'</button></div>'
 +'<label style="display:block;margin-top:12px">Avatar (usado sem foto)</label><div class="pick">'+AV.map(a=>'<button data-av="'+a+'" aria-label="Avatar '+a+'"'+(a===S.avatar?' class="sel"':'')+'>'+a+'</button>').join('')+'</div><label>Cor do tema</label><div class="pick">'+CO.map(c=>'<button class="sw'+sl(c===S.accent)+'" data-co="'+c+'" style="background:'+c+'" aria-label="Cor '+c+'"></button>').join('')+'</div></div>'
 +'<div class="win"><h2>CAPA</h2><div class="pick">'+COV.map((c,i)=>'<button class="cv'+sl(!S.cvi&&S.cv===i)+'" data-cv="'+i+'" style="background:linear-gradient(135deg,'+c.join(',')+')" aria-label="Capa '+(i+1)+'"></button>').join('')+'</div><label>Personalizar cores</label><div class="acts"><input type="color" id="c1" value="'+S.c1+'" aria-label="Cor 1"><input type="color" id="c2" value="'+S.c2+'" aria-label="Cor 2"></div><div class="acts"><label class="btn g fbtn">🖼️ Capa da galeria<input type="file" id="fcv" accept="image/*"></label><button id="rci">Remover</button></div></div>'}
function cfg(){const sw=(id,k,l)=>'<button class="swt" id="'+id+'" role="switch" aria-checked="'+!!S.au[k]+'" aria-label="'+l+'"></button>',
 rw=(l,d,c)=>'<div class="set"><div><div class="nm">'+l+'</div><div class="sm">'+d+'</div></div>'+c+'</div>',sl=c=>c?' sel':'';
 $('cfd').innerHTML='<div class="win"><h2>ÁUDIO</h2>'+rw('Música de fundo','Trilha de metal',sw('tm','m','Música'))+rw('Volume da música','','<input type="range" id="vm" min="0" max="100" value="'+(S.vm??50)+'" aria-label="Volume da música">')
 +rw('Efeitos sonoros','Cliques e alertas',sw('ts','s','Efeitos'))+rw('Volume dos efeitos','','<input type="range" id="vs" min="0" max="100" value="'+(S.vs??50)+'" aria-label="Volume dos efeitos">')
 +rw('Voz do sistema','Fala ao concluir missões',sw('tv','v','Voz'))+'</div>'
 +'<div class="win"><h2>ESTILO DA VOZ</h2><div class="acts">'+VP.map((v,i)=>'<button class="g'+sl(i===(S.vp||0))+'" data-vp="'+i+'">'+v.n+'</button>').join('')+'</div><div class="acts"><button class="g" id="tst">▶ Testar voz</button></div></div>'
 +'<div class="win"><h2>ÁUDIO PERSONALIZADO</h2><p class="sm" style="margin:0 0 8px">Use um áudio seu no lugar da voz do sistema (até 12 s e 1,5 MB). '+(VA?'Ativo: <b>'+esc(VA.n)+'</b>':'Nenhum selecionado.')+'</p><div class="acts"><label class="btn g fbtn">🎙️ Escolher áudio<input type="file" id="fau" accept="audio/*"></label></div><div class="acts"><button class="g" id="tsa"'+(VA?'':' disabled')+'>▶ Testar</button><button class="g x" id="rma"'+(VA?'':' disabled')+'>Remover</button></div></div>'
 +uiWin()
 +'<div class="win"><h2>CONTA</h2><p class="sm" style="margin:0 0 8px">Conectado como <b>'+esc(U)+'</b></p><div class="acts"><button class="g" id="out">Sair</button><button class="g x" id="rst">Reiniciar progresso</button></div></div>'}
function show(v){['q','st','sh','rk','pf','cf'].forEach(k=>{$('v-'+k).hidden=k!==v});document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('sel',b.dataset.v===v));if(v==='pf')pf();if(v==='rk')rk();if(v==='cf')cfg();if(v==='sh')shop();window.scrollTo(0,0)}

$('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
let pd=0;
$('ql').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=+b.dataset.i,q=S.q.find(x=>x.id===id);
 if(b.dataset.a==='s')bump(id,q.step);else if(b.dataset.a==='f')bump(id,q.goal);
 else if(pd===id){S.q=S.q.filter(x=>x.id!==id);pd=0;save();draw()}else{pd=id;toast('[SISTEMA] Toque em ✕ de novo para remover a missão.');setTimeout(()=>pd=0,3500)}};
$('add').onclick=()=>{const n=$('qn').value.trim(),g=parseInt($('qg').value);if(!n||!g||g<1){toast('[SISTEMA] Informe o nome e uma meta maior que zero.');return}
 S.q.push(mkq(S,n,g,$('qu').value.trim()||'x',$('qs2').value));$('qn').value=$('qg').value=$('qu').value='';save();draw();toast('[SISTEMA] Nova missão registrada.')};
$('v-pf').oninput=e=>{if(e.target.id==='pn')S.name=e.target.value.trim()||U;if(e.target.id==='pb')S.bio=e.target.value.trim();if(e.target.id==='pt')S.ttl=e.target.value.trim();if(e.target.id==='c1'||e.target.id==='c2'){S[e.target.id]=e.target.value;S.cv=-1;S.cvi=''}save();draw()};
$('v-pf').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.cv){S.cv=+b.dataset.cv;S.cvi='';save();draw();pf()}
 else if(b.dataset.vp){S.vp=+b.dataset.vp;save();rr();say(['mc'])}
 else if(b.id==='rph'){S.photo='';save();draw();pf()}
 else if(b.id==='sh'){S.shape=S.shape?0:1;save();draw();pf()}
 else if(b.id==='rci'){S.cvi='';save();draw();pf()}
 else if(b.dataset.u){const [k,v]=b.dataset.u.split(':'),u=uic();u[k]=+v;S.ui=u;save();applyUI();cfg()}
 else if(b.dataset.ut){const k=b.dataset.ut,u=uic();u[k]=u[k]?0:1;S.ui=u;save();applyUI();cfg();if(k==='fl'&&u.fl&&!document.fullscreenElement)goFS()}
 else if(b.id==='fsb')goFS()
 else if(b.id==='tsa')playVA()
 else if(b.id==='rma'){VA=null;try{localStorage.removeItem('sistema-aud-'+U)}catch(e){}cfg();toast('[SISTEMA] Áudio removido. Voltando à voz do sistema.')}
 else if(b.id==='tst')say(['mc','ex'])
 else if(b.dataset.av){S.avatar=b.dataset.av;save();draw();pf()}
 else if(b.dataset.co){S.accent=b.dataset.co;save();draw();pf()}
 else if(/^t[msv]$/.test(b.id)){const k=b.id[1];S.au[k]=S.au[k]?0:1;save();if(k==='m')music(!!S.au.m);rr()}
 else if(b.id==='out'){save();U=null;VA=null;S={au:{...S.au}};music(false);ls.set('sistema-sess',null);$('app').hidden=$('nav').hidden=true;$('auth').hidden=false;$('lp').value=$('lp2').value=''}
 else if(b.id==='rst'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Toque de novo para apagar';setTimeout(()=>{delete b.dataset.c;b.textContent='Reiniciar progresso'},3500);return}
  const o=S;S=fresh(o.name);S.avatar=o.avatar;S.accent=o.accent;S.bio=o.bio;S.au=o.au;for(const k of ['photo','cvi','cv','c1','c2','ttl','shape','vp','vm','vs','gid','ui'])S[k]=o[k];save();draw();rr();toast('[SISTEMA] Progresso reiniciado.')}};
document.addEventListener('click',e=>{if(e.target.closest('button')){sfx(e.target.closest('.x')?'del':'click');if(S.au.m)music(true)}},true);

const rr=()=>$('v-cf').hidden?pf():cfg();
$('cfd').onclick=$('v-pf').onclick;$('gcf').onclick=()=>show('cf');
$('cfd').onchange=e=>{if(e.target.id!=='fau')return;const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
 if(f.size>1.5e6)return toast('[SISTEMA] Áudio grande demais. Use até 1,5 MB (cerca de 12 segundos).');
 const r=new FileReader();r.onload=()=>{const a=new Audio(r.result);a.onerror=()=>toast('[SISTEMA] Formato de áudio não suportado. Tente MP3, M4A, OGG ou WAV.');
  a.onloadedmetadata=()=>{if(a.duration>12)return toast('[SISTEMA] Áudio longo demais. Use até 12 segundos.');
   const v={n:f.name.slice(0,40),d:r.result};try{localStorage.setItem('sistema-aud-'+U,JSON.stringify(v))}catch(err){return toast('[SISTEMA] Não foi possível salvar o áudio (espaço cheio).')}
   VA=v;cfg();playVA();toast('[SISTEMA] Áudio personalizado ativado.')}};r.readAsDataURL(f)};
$('cfd').oninput=e=>{if(e.target.id==='vm'||e.target.id==='vs'){S[e.target.id]=+e.target.value;save();applyVol()}};
$('v-pf').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 if(e.target.id==='fph')useImg(f,160,160,d=>{S.photo=d;save();draw();pf()});
 if(e.target.id==='fcv')useImg(f,640,240,d=>{S.cvi=d;save();draw();pf()})};
const wake=()=>{if(S.au.m)music(true);else if(AC&&AC.state==='suspended')AC.resume()};
['pointerup','touchend','keydown','click'].forEach(v=>document.addEventListener(v,wake,true));
const enc=new TextEncoder();
async function hh(p,salt){try{const b=await crypto.subtle.digest('SHA-256',enc.encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+p)h=(h*33+c.charCodeAt(0))>>>0;return'f'+h}}
let mode='in';
function setMode(m){mode=m;$('tin').classList.toggle('sel',m==='in');$('tup').classList.toggle('sel',m==='up');$('cf').hidden=m==='in';$('go').textContent=m==='in'?'Entrar':'Criar conta';$('err').textContent=''}
$('tin').onclick=()=>setMode('in');$('tup').onclick=()=>setMode('up');
async function go(){const u=$('lu').value.trim().toLowerCase(),p=$('lp').value,X=ls.get('sistema-users')||{},er=t=>{$('err').textContent=t};
 if(!/^[a-z0-9_]{3,20}$/.test(u))return er('Usuário: 3 a 20 letras minúsculas, números ou _.');
 if(p.length<6)return er('A senha precisa ter ao menos 6 caracteres.');
 if(mode==='up'){if(X[u])return er('Esse usuário já existe.');if(p!==$('lp2').value)return er('As senhas não coincidem.');
  const salt=Math.random().toString(36).slice(2);X[u]={s:salt,h:await hh(p,salt)};ls.set('sistema-users',X);
  const old=Object.keys(X).length===1?ls.get('sistema-v1'):null,st=fresh(u);
  if(old&&old.lv&&old.q)Object.assign(st,old,{q:old.q.map(q=>({base:q.goal,n:0,...q})),name:old.name==='Jogador'?u:old.name});
  ls.set('sistema-d-'+u,st)}
 else{const a=X[u];if(!a||a.h!==await hh(p,a.s))return er('Usuário ou senha incorretos.')}
 enter(u)}
$('go').onclick=go;$('lp').onkeydown=$('lp2').onkeydown=e=>{if(e.key==='Enter')go()};
function enter(u){U=u;ls.set('sistema-sess',u);S=Object.assign(fresh(u),ls.get('sistema-d-'+u)||{});S.au=Object.assign({m:1,s:1,v:1},S.au);VA=ls.get('sistema-aud-'+u)||null;save();applyUI();
 $('auth').hidden=true;$('app').hidden=$('nav').hidden=false;$('err').textContent='';rollover();draw();show('q');music(!!S.au.m);
 setTimeout(()=>toast('[SISTEMA] Jogador identificado: '+S.name+'.\nMissões diárias disponíveis.'),300)}
music(true);
const ss=ls.get('sistema-sess');if(ss&&(ls.get('sistema-users')||{})[ss])enter(ss);
if(SHOP_ON||location.hash==='#loja')$('nsh').hidden=false;
applyUI();
let fsT=false;const inApp=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
['pointerup','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(fsT)return;fsT=true;if(uic().fl&&!inApp()&&!document.fullscreenElement)goFS()},{passive:true}));
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
